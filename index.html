<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Super Moverz Coach Playbook — Field-ready guide to every Super Moverz game." />
  <meta name="theme-color" content="#0a1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SMZ Coaches" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <title>Super Moverz — Coach Playbook</title>

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Stylesheets — order matters -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/cards.css" />

  <!-- PDF export for class print sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <!-- Ambient backdrop — matches The Card Vault's painted blue/gold background,
       sits behind #app (negative z-index), stays put across route changes -->
  <div class="app-bg-fill"></div>
  <div class="app-bg-photo"></div>
  <div class="app-bg-vignette"></div>
  <div class="app-bg-top-shade"></div>
  <div class="app-motes" id="app-motes"></div>

  <!-- App root — router renders into this -->
  <div id="app">
    <!-- Initial loading state shown before JS runs -->
    <div class="loading">Loading Coach Playbook…</div>
  </div>

  <!-- Page renderers -->
  <script src="pages/home.js"></script>
  <script src="pages/library.js"></script>
  <script src="pages/detail.js"></script>
  <script src="pages/favorites.js"></script>
  <script src="pages/cards.js"></script>
  <script src="pages/crystals.js"></script>
  <script src="pages/card-vault.js"></script>

  <!-- Core modules -->
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/data.js"></script>
  <script src="js/card-image-store.js"></script>
  <script src="js/cards-state.js"></script>
  <script src="js/image-utils.js"></script>
  <script src="js/card-assets.js"></script>
  <script src="js/card-render.js"></script>
  <script src="js/card-viewer.js"></script>
  <script src="js/print-sheets.js"></script>
  <script src="js/scoring-guide.js"></script>
  <script src="pages/card-creator.js"></script>

  <!-- App entry point — must load last -->
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    // Ambient gold/blue flecks drifting up over the backdrop — same look as
    // The Card Vault, generated once since this container lives outside #app
    // and isn't touched by route re-renders.
    (function(){
      const root = document.getElementById('app-motes');
      if (!root) return;
      for (let i = 0; i < 85; i++) {
        const m = document.createElement('div');
        const isBig = Math.random() < 0.22;
        m.className = 'app-mote' + (Math.random() < 0.18 ? ' blue' : '') + (isBig ? ' big' : '');
        const size = isBig ? 5 + Math.random() * 4 : 2 + Math.random() * 3;
        m.style.width = size + 'px';
        m.style.height = size + 'px';
        m.style.left = Math.random() * 100 + 'vw';
        m.style.bottom = '-10px';
        m.style.animationDuration = (18 + Math.random() * 22) + 's';
        m.style.animationDelay = (Math.random() * 18) + 's';
        root.appendChild(m);
      }
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.info('SMZ: Service worker registered.', reg.scope))
          .catch(err => console.warn('SMZ: Service worker registration failed.', err));
      });
    }
  </script>

</body>
</html>

<title>The Card Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080e1c;
    --bg-deep:#040810;
    --case:#0d1730;
    --case-2:#0a1326;
    --shelf:#101d3a;
    --line:#28365a;
    --line-soft:rgba(255,255,255,0.07);
    --text:#eef2f9;
    --text-dim:#93a1bd;
    --text-faint:#5c6a8a;
    --gold:#e8b84b;
    --gold-dim:#a9843a;

    --wood-1:#241309;
    --wood-2:#3c2413;
    --wood-3:#59391a;
    --wood-4:#170c05;

    --safety:#ef4444;
    --unity:#22c55e;
    --willpower:#3b82f6;
    --energy:#eab308;
    --reaction:#a855f7;
    --neutral:#8391b3;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#080e1c; --bg-deep:#040810; --case:#0d1730; --case-2:#0a1326; --shelf:#101d3a;
      --line:#28365a; --text:#eef2f9; --text-dim:#93a1bd; --text-faint:#5c6a8a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#080e1c; --bg-deep:#040810; --case:#0d1730; --case-2:#0a1326; --shelf:#101d3a;
    --line:#28365a; --text:#eef2f9; --text-dim:#93a1bd; --text-faint:#5c6a8a;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'DM Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue', 'Arial Narrow', sans-serif;
    letter-spacing:0.03em;
    font-weight:400;
  }
  button{ font-family:inherit; }

  /* solid backdrop matching the art's own blue — fills the flanks on ultra-wide screens */
  .bg-fill{
    position:fixed; inset:0; z-index:-5;
    background:linear-gradient(165deg, #0a2d78 0%, #062060 55%, #030f38 100%);
  }
  /* the real painted blue + gold-flame background art, used as-is — width-capped so
     full-screen / ultra-wide windows don't blow the border art up huge */
  .bg-photo{
    position:fixed; top:0; bottom:0; left:50%; z-index:-4;
    width:min(100vw, 1500px); transform:translateX(-50%);
    background-image:url('img/bg_photo.jpg');
    background-size:cover; background-position:center center; background-repeat:no-repeat;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
  }
  /* light scrim so the logo + title stay crisp over the painted texture */
  .bg-top-shade{
    position:fixed; top:0; left:0; right:0; height:min(220px, 30vh); z-index:-3; pointer-events:none;
    background:linear-gradient(180deg, rgba(4,10,26,0.55) 0%, rgba(4,10,26,0.28) 55%, transparent 100%);
  }
  .bg-vignette{
    position:fixed; inset:0; z-index:-3; pointer-events:none;
    background:radial-gradient(ellipse 86% 70% at 50% 55%, transparent 58%, rgba(0,0,0,0.38) 100%);
  }
  .motes{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .mote{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,120,0.95), rgba(255,214,120,0) 70%);
    box-shadow:0 0 10px 2px rgba(255,196,90,0.55);
    animation:drift linear infinite;
    opacity:0.7;
  }
  .mote.blue{
    background:radial-gradient(circle, rgba(93,161,255,0.95), rgba(93,161,255,0) 70%);
    box-shadow:0 0 10px 2px rgba(93,161,255,0.45);
  }
  .mote.big{ box-shadow:0 0 16px 4px rgba(255,196,90,0.6); }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:.85; }
    92%{ opacity:.55; }
    100%{ transform:translateY(-120vh) translateX(20px); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .mote{ animation:none; display:none; }
    .chest-glow{ animation:none; }
  }

  .wrap{ max-width:1180px; margin:0 auto; padding:22px 18px 26px; }

  /* ---------- Header ---------- */
  header{ text-align:center; margin-bottom:16px; }
  .brand{
    display:block; margin:0 auto 6px;
    width:min(200px, 46vw);
    filter:drop-shadow(0 4px 14px rgba(0,0,0,0.45));
  }
  .brand img{ display:block; width:100%; height:auto; }
  h1.title{
    font-size:clamp(24px,3.6vw,38px);
    margin:0; line-height:1;
    background:linear-gradient(180deg,#ffffff 8%, #d6e0f5 42%, #8fa3d6 75%, #5f76ab 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 rgba(59,130,246,0.35)) drop-shadow(0 6px 16px rgba(59,130,246,0.25));
    text-wrap:balance;
  }
  .title-rule{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:8px auto 0; max-width:260px;
  }
  .title-rule .line{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold-dim), transparent); }
  .title-rule .gem{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 8px var(--gold); }
  .subtitle{
    margin:8px auto 0; max-width:520px;
    color:var(--text-dim); font-size:12.5px; line-height:1.5;
  }
  .legend{
    display:flex; flex-wrap:wrap; gap:14px 22px; justify-content:center;
    margin-top:14px;
  }
  .legend-item{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:54px; cursor:pointer; user-select:none;
    font-size:9.5px; color:var(--text-dim); letter-spacing:0.05em;
    text-transform:uppercase; text-align:center;
    transition:color .2s ease;
  }
  .legend-item:focus-visible{ outline:1.5px solid var(--c); outline-offset:3px; border-radius:6px; }
  .legend-icon{
    width:42px; height:42px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle, rgba(255,255,255,0.07), transparent 72%);
    filter:drop-shadow(0 3px 7px rgba(0,0,0,0.55));
    transition:transform .2s ease, filter .2s ease, background .2s ease;
  }
  .legend-icon img{ width:100%; height:100%; object-fit:contain; }
  .legend-item:hover .legend-icon{
    transform:translateY(-2px) scale(1.08);
    filter:drop-shadow(0 5px 10px rgba(0,0,0,0.6));
  }
  .legend-item.is-selected{ color:#fff; }
  .legend-item.is-selected .legend-icon{
    transform:translateY(-2px) scale(1.12);
    background:radial-gradient(circle, rgba(255,255,255,0.18), transparent 72%);
    filter:drop-shadow(0 0 9px var(--c)) drop-shadow(0 5px 12px rgba(0,0,0,0.6));
    animation:legendPulse 1.6s ease-in-out infinite;
  }
  @keyframes legendPulse{
    0%,100%{ filter:drop-shadow(0 0 7px var(--c)) drop-shadow(0 5px 12px rgba(0,0,0,0.6)); }
    50%{ filter:drop-shadow(0 0 15px var(--c)) drop-shadow(0 5px 12px rgba(0,0,0,0.6)); }
  }

  /* ---------- the chest ---------- */
  .chest{
    position:relative;
    padding:26px 22px 20px;
    border-radius:26px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 2px, transparent 2px, transparent 46px),
      repeating-linear-gradient(3deg, rgba(255,255,255,0.035) 0px, transparent 1px, transparent 7px, rgba(0,0,0,0.06) 8px, transparent 9px),
      linear-gradient(160deg, var(--wood-3) 0%, var(--wood-2) 45%, var(--wood-1) 100%);
    box-shadow:
      0 40px 80px -34px rgba(0,0,0,0.9),
      inset 0 0 0 1px rgba(0,0,0,0.5),
      inset 0 0 70px rgba(0,0,0,0.55),
      inset 0 2px 0 rgba(255,255,255,0.06);
  }
  .chest::before{
    /* brass trim */
    content:''; position:absolute; inset:8px; border-radius:19px; pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(217,174,99,0.55), inset 0 0 0 3px rgba(0,0,0,0.4);
  }
  .chest::after{
    /* rivet strip along the top edge */
    content:''; position:absolute; top:13px; left:34px; right:34px; height:4px; pointer-events:none;
    background-image: repeating-radial-gradient(circle at 9px 2px, rgba(255,224,153,0.85) 0 1.6px, transparent 2px 42px);
    opacity:.7;
  }
  .chest-glow{
    position:absolute; inset:0; border-radius:26px; pointer-events:none;
    background:radial-gradient(ellipse 70% 55% at 50% 15%, rgba(232,184,75,0.14), transparent 65%);
    animation:chestPulse 6s ease-in-out infinite;
  }
  @keyframes chestPulse{ 0%,100%{ opacity:.7; } 50%{ opacity:1; } }

  .compartments{
    position:relative;
    display:grid; grid-template-columns:1fr 1fr; gap:18px;
    align-items:stretch;
  }
  #guardians, #games{ height:100%; }

  /* ---------- gilded frame ---------- */
  .case-frame{
    position:relative;
    height:100%;
    display:flex; flex-direction:column;
    padding:8px;
    border-radius:20px;
    background:linear-gradient(160deg, #e9c47c 0%, #a9793a 16%, #5c3f18 42%, #7a541f 60%, #d4a559 82%, #8a672c 100%);
    box-shadow:
      0 20px 40px -22px rgba(0,0,0,0.85),
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -2px 5px rgba(0,0,0,0.45);
  }
  .case-frame::before{
    content:''; position:absolute; inset:4px; border-radius:15px; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,228,168,0.3);
  }

  .case-banner{
    position:absolute; top:-15px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px; white-space:nowrap;
    padding:6px 18px; border-radius:999px; z-index:8;
    background:linear-gradient(160deg, #16233d 0%, #0a1220 100%);
    border:2px solid #d9ae63;
    box-shadow:0 8px 18px -8px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .case-banner .gem{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 7px var(--gold); flex:none; }
  .case-banner .txt{
    font-family:'Bebas Neue',sans-serif; font-size:13.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:#f5e2ae; text-shadow:0 0 8px rgba(232,184,75,0.5);
  }

  /* ---------- the case interior ---------- */
  .case{
    position:relative;
    flex:1 1 auto;
    background:linear-gradient(165deg, var(--case) 0%, var(--case-2) 65%, #070c18 100%);
    border-radius:13px;
    padding:22px 14px 12px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.05),
      inset 0 0 40px rgba(0,0,0,0.4);
  }
  .case-glass{
    position:absolute; inset:0; border-radius:13px; pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 26%);
  }

  /* fixed 3-column page grid — used identically for both Guardian and Game cards */
  .page-grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px 8px;
  }

  /* ---------- card slot ---------- */
  .card-slot{ position:relative; }
  .slot-frame{
    position:absolute; top:0; left:0; width:100%; aspect-ratio:620/825;
    transform:scale(1.07); transform-origin:center center;
    border-radius:8px; z-index:1; pointer-events:none;
    opacity:.8; transition:opacity .22s ease, box-shadow .22s ease;
    box-shadow:inset 0 0 0 1px rgba(217,174,99,0.14);
    background:
      linear-gradient(rgba(217,174,99,0.85), rgba(217,174,99,0.85)) top left / 13px 2px no-repeat,
      linear-gradient(rgba(217,174,99,0.85), rgba(217,174,99,0.85)) top left / 2px 13px no-repeat,
      linear-gradient(rgba(217,174,99,0.85), rgba(217,174,99,0.85)) top right / 13px 2px no-repeat,
      linear-gradient(rgba(217,174,99,0.85), rgba(217,174,99,0.85)) top right / 2px 13px no-repeat,
      linear-gradient(rgba(217,174,99,0.85), rgba(217,174,99,0.85)) bottom left / 13px 2px no-repeat,
      linear-gradient(rgba(217,174,99,0.85), rgba(217,174,99,0.85)) bottom left / 2px 13px no-repeat,
      linear-gradient(rgba(217,174,99,0.85), rgba(217,174,99,0.85)) bottom right / 13px 2px no-repeat,
      linear-gradient(rgba(217,174,99,0.85), rgba(217,174,99,0.85)) bottom right / 2px 13px no-repeat;
  }
  .card-slot:hover .slot-frame, .card-slot:focus-within .slot-frame{ opacity:1; }
  .card-slot.power-glow .slot-frame{
    opacity:1;
    box-shadow:inset 0 0 0 1px var(--c), 0 0 14px -3px var(--c);
  }
  .card-slot.power-dim .slot-frame{ opacity:.35; }
  .card-slot .shadow{
    position:absolute; left:50%; bottom:5px; width:70%; height:7px;
    background:radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 70%);
    transform:translateX(-50%); border-radius:50%;
    transition:opacity .22s ease, transform .22s ease;
  }
  .card-face{
    all:unset; cursor:pointer; display:block; position:relative; z-index:2;
    width:100%; aspect-ratio:620/825; border-radius:6px; overflow:hidden;
    border:1.5px solid rgba(255,255,255,0.07);
    background:var(--bg-deep);
    transform:translateY(0) scale(1);
    transition:transform .22s cubic-bezier(.2,.8,.3,1), border-color .2s ease, box-shadow .22s ease;
    box-shadow:0 6px 10px -6px rgba(0,0,0,0.7);
  }
  .card-face img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-slot .name{
    display:block; margin-top:4px; text-align:center;
    font-family:'Bebas Neue',sans-serif; font-size:9.5px; letter-spacing:0.02em;
    color:var(--text-faint); transition:color .2s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-slot:hover .card-face, .card-slot:focus-within .card-face, .card-slot.is-active .card-face{
    transform:translateY(-8px) scale(1.14);
    border-color:var(--c);
    box-shadow:0 20px 26px -14px rgba(0,0,0,0.8), 0 0 20px -4px var(--c);
    z-index:6;
  }
  .card-slot:hover .shadow, .card-slot:focus-within .shadow, .card-slot.is-active .shadow{
    opacity:0.35; transform:translateX(-50%) scale(0.7);
  }
  .card-slot:hover .name, .card-slot:focus-within .name, .card-slot.is-active .name{ color:#fff; }

  /* ---------- power-legend glow filter ---------- */
  .card-slot{ transition:opacity .25s ease; }
  .card-slot.power-glow .card-face{
    transform:translateY(-8px) scale(1.14);
    border-color:var(--c);
    box-shadow:0 20px 28px -14px rgba(0,0,0,0.8), 0 0 22px -2px var(--c), 0 0 40px -4px var(--c);
    z-index:5;
    animation:cardGlowPulse 1.8s ease-in-out infinite;
  }
  .card-slot.power-glow .shadow{ opacity:0.35; transform:translateX(-50%) scale(0.7); }
  .card-slot.power-glow .name{ color:#fff; }
  .card-slot.power-dim{ opacity:0.3; }
  .card-slot.power-dim .card-face{ filter:saturate(0.55); }
  @keyframes cardGlowPulse{
    0%,100%{ box-shadow:0 20px 28px -14px rgba(0,0,0,0.8), 0 0 14px -2px var(--c), 0 0 30px -4px var(--c); }
    50%{ box-shadow:0 20px 28px -14px rgba(0,0,0,0.8), 0 0 26px 0px var(--c), 0 0 48px -2px var(--c); }
  }
  @media (prefers-reduced-motion: reduce){
    .legend-item.is-selected .legend-icon, .card-slot.power-glow .card-face{ animation:none !important; }
  }

  /* ---------- tooltip (single, JS-positioned) ---------- */
  #tooltip{
    position:fixed; z-index:60; width:236px;
    background:linear-gradient(165deg, #10193a 0%, #070c18 100%);
    border:1px solid var(--line); border-top:3px solid var(--c);
    border-radius:11px; padding:13px 15px 15px;
    box-shadow:0 26px 50px -18px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.04);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .14s ease, visibility .14s ease;
  }
  #tooltip.show{ opacity:1; visibility:visible; }
  #tooltip .kicker{
    font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--c); font-weight:700; margin-bottom:5px;
  }
  #tooltip h4{ margin:0 0 7px; font-size:20px; font-family:'Bebas Neue',sans-serif; color:#fff; }
  #tooltip p{ margin:0; font-size:12.5px; line-height:1.55; color:var(--text-dim); }
  #tooltip p.placeholder{ color:var(--text-faint); font-style:italic; }
  #tooltip .sub{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:11.5px; color:var(--text-faint); font-style:italic; line-height:1.5; }
  #tooltip .sub b{ display:block; font-style:normal; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:3px; }

  /* ---------- click-to-enlarge card viewer ---------- */
  #modal-backdrop{
    position:fixed; inset:0; z-index:90;
    background:rgba(4,6,14,0.82);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; visibility:hidden;
    transition:opacity .28s ease, visibility .28s ease;
  }
  #modal-backdrop.show{ opacity:1; visibility:visible; }

  #modal-card{
    position:fixed; z-index:95; left:0; top:0; width:1px; height:1px;
    border-radius:9px; visibility:hidden;
    background:var(--bg-deep);
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.9), 0 0 0 2px var(--c), 0 0 46px -6px var(--c);
    transition:left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1),
               width .38s cubic-bezier(.2,.8,.2,1), height .38s cubic-bezier(.2,.8,.2,1),
               box-shadow .38s ease;
    cursor:pointer;
    perspective:1600px;
  }
  .card-flip-inner{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.3,.1,.2,1);
    border-radius:9px;
  }
  #modal-card.flipped .card-flip-inner{ transform:rotateY(180deg); }
  .card-face-front, .card-face-back{
    position:absolute; inset:0; width:100%; height:100%;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:9px; overflow:hidden;
  }
  .card-face-back{ transform:rotateY(180deg); }
  #modal-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-flip-hint{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    z-index:3; pointer-events:none; white-space:nowrap;
    padding:5px 14px; border-radius:999px;
    font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    color:#f5e2ae; background:rgba(8,13,26,0.72);
    border:1px solid rgba(217,174,99,0.5);
    opacity:0; transition:opacity .3s ease .3s;
  }
  #modal-card.hint-show .card-flip-hint{ opacity:.95; }
  @media (prefers-reduced-motion: reduce){
    .card-flip-inner{ transition-duration:.01ms; }
  }

  #modal-info{
    position:fixed; z-index:95; left:0; top:0;
    background:linear-gradient(165deg, #10193a 0%, #070c18 100%);
    border:1px solid var(--line); border-top:3px solid var(--c);
    border-radius:12px; padding:18px 20px 20px;
    box-shadow:0 26px 60px -18px rgba(0,0,0,0.85);
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  #modal-info.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #modal-info .kicker{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--c); font-weight:700; margin-bottom:6px; }
  #modal-info h3{ margin:0 0 9px; font-size:27px; font-family:'Bebas Neue',sans-serif; color:#fff; }
  #modal-info p{ margin:0; font-size:13.5px; line-height:1.6; color:var(--text-dim); }
  #modal-info p.placeholder{ color:var(--text-faint); font-style:italic; }
  #modal-info .sub{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--text-faint); font-style:italic; line-height:1.55; }
  #modal-info .sub b{ display:block; font-style:normal; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:4px; }

  #modal-close{
    position:fixed; z-index:96; top:18px; right:18px; width:36px; height:36px; border-radius:50%;
    background:rgba(10,15,30,0.85); border:1px solid var(--line); color:#fff;
    font-size:18px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, background .2s ease;
  }
  #modal-close.show{ opacity:1; pointer-events:auto; }
  #modal-close:hover{ background:rgba(20,28,50,0.95); }

  @media (prefers-reduced-motion: reduce){
    #modal-card, #modal-info, #modal-backdrop, #modal-close{ transition-duration:.01ms !important; }
  }

  footer{
    text-align:center; color:var(--text-faint); font-size:10.5px;

  .intro-rune-ring .ring-outer{ stroke-width:1; stroke-dasharray:1.5 7; }

  @keyframes runeSpin{ to{ transform:rotate(360deg); } }
  #intro.anticipate .intro-rune-ring{ animation:runeSpin 2.1s linear infinite; opacity:.8; transition:opacity .3s ease; }

  .intro-sigils{ position:absolute; inset:0; z-index:1; }

    position:absolute; top:50%; left:50%;
    width:clamp(46px,8.6vw,60px); height:clamp(46px,8.6vw,60px); border-radius:50%;

  .sigil img{ width:68%; height:68%; object-fit:contain; filter:grayscale(.5) brightness(.65); transition:filter .3s ease; }
  /* five evenly-spaced points around the ring, Will Power at 12 o'clock */
  .sigil.s-willpower{ transform:translate(-50%,-50%) translate(0, calc(var(--ring-r) * -1)); }
  .sigil.s-safety{ transform:translate(-50%,-50%) translate(calc(var(--ring-r) * 0.951), calc(var(--ring-r) * -0.309)); }
  .sigil.s-unity{ transform:translate(-50%,-50%) translate(calc(var(--ring-r) * 0.588), calc(var(--ring-r) * 0.809)); }
  .sigil.s-energy{ transform:translate(-50%,-50%) translate(calc(var(--ring-r) * -0.588), calc(var(--ring-r) * 0.809)); }
  .sigil.s-reaction{ transform:translate(-50%,-50%) translate(calc(var(--ring-r) * -0.951), calc(var(--ring-r) * -0.309)); }
  /* each sigil's own color, always available so the glow survives the anticipate -> charged handoff */
  .sigil.s-safety{ --sg:rgba(239,68,68,0.85); }
  .sigil.s-unity{ --sg:rgba(34,197,94,0.85); }
  .sigil.s-willpower{ --sg:rgba(59,130,246,0.85); }
  .sigil.s-energy{ --sg:rgba(234,179,8,0.85); }
  .sigil.s-reaction{ --sg:rgba(168,85,247,0.85); }
  @keyframes sigilIgnite{
    0%{ opacity:.32; box-shadow:none; }

  #intro.anticipate .sigil{ animation:sigilIgnite .65s ease-out forwards; }
  #intro.anticipate .sigil img{ filter:none; }
  #intro.anticipate .sigil.s-safety{ animation-delay:0s; }
  #intro.anticipate .sigil.s-unity{ animation-delay:.5s; }
  #intro.anticipate .sigil.s-willpower{ animation-delay:1s; }
  #intro.anticipate .sigil.s-energy{ animation-delay:1.5s; }
  #intro.anticipate .sigil.s-reaction{ animation-delay:2s; }
  /* hold the lit state through the charged bloom instead of snapping dark when 'anticipate' ends */
  #intro.charged .sigil{ opacity:1; box-shadow:0 0 11px 3px var(--sg); }
  #intro.charged .sigil img{ filter:none; }

  /* beams of color that carry each sigil's power to the seal */
  .intro-beams{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .intro-beam{
    position:absolute; height:3px; margin-top:-1.5px; border-radius:2px;

  @keyframes beamFly{

    82%{ opacity:1; }
    100%{ opacity:0; transform:rotate(var(--rot,0deg)) scaleX(1); }

  /* the logo stands completely alone at rest — no ring, no halo, nothing added */
  .intro-seal{

    display:flex; align-items:center; justify-content:center; border-radius:50%;

    box-shadow:0 0 0 0 rgba(232,184,75,0);
  }
  .intro-seal img{ width:100%; height:100%; object-fit:contain; position:relative; z-index:1; filter:drop-shadow(0 5px 16px rgba(0,0,0,0.55)); transition:filter .7s ease; }
  .intro-cover-face h2{
    margin:0; font-size:clamp(26px,4.4vw,44px); letter-spacing:.05em; line-height:1;
    background:linear-gradient(180deg,#fff 8%, #f0d9a0 45%, var(--gold) 80%, var(--gold-dim) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,0.5));

  .intro-tagline{

  .intro-hint{
    margin:14px 0 0; padding:9px 22px; border-radius:999px;
    font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
    color:#f5e2ae; opacity:.9;

    border:1.5px solid rgba(217,174,99,0.55);
    box-shadow:0 8px 18px -8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    animation:hintPulse 2.2s ease-in-out infinite;
  }
  @keyframes hintPulse{ 0%,100%{ opacity:.45; } 50%{ opacity:.95; } }

  /* mystical charge-up — the logo gradually gathers light as each power arrives, over the whole build.
     The glow lives entirely in the img's own drop-shadow (which follows the shield's alpha silhouette),
     never in a box-shadow on the wrapper — a box-shadow paints a flat circular disc that flattens the
     wood-grain texture underneath it and reads as an unwanted "shaded circle". */
  @keyframes sealCharge{

  }
  #intro.anticipate .intro-seal{ animation:sealCharge var(--anticipate-dur, 2.8s) ease-in forwards; }
  #intro.anticipate .intro-seal img{ filter:drop-shadow(0 5px 16px rgba(0,0,0,0.55)) drop-shadow(0 0 22px rgba(255,230,170,0.95)) drop-shadow(0 0 42px rgba(255,210,120,0.6)); transition:filter var(--anticipate-dur, 2.8s) ease-in; }

    50%{ filter:drop-shadow(0 5px 16px rgba(0,0,0,0.55)) drop-shadow(0 0 40px rgba(255,247,224,1)) drop-shadow(0 0 72px rgba(255,224,150,0.8)) hue-rotate(35deg) saturate(1.4); }
    100%{ filter:drop-shadow(0 5px 16px rgba(0,0,0,0.55)) drop-shadow(0 0 34px rgba(255,247,224,1)) drop-shadow(0 0 62px rgba(255,238,198,0.75)) hue-rotate(0deg) saturate(1); }
  }

  .intro-charge-flash{

  .intro-shock-ring{

  /* ---------- replay button ---------- */
  #replay-intro{

function buildLegend(){
  const root = document.getElementById('legend');
  POWER_ORDER.filter(k => k !== 'unassigned').forEach(k => {
    const p = POWER_META[k];
    const li = document.createElement('div');
    li.className = 'legend-item';
    li.dataset.power = k;
    li.style.setProperty('--c', p.color);
    li.setAttribute('role', 'button');
    li.setAttribute('tabindex', '0');
    li.setAttribute('aria-pressed', 'false');
    li.innerHTML = `<span class="legend-icon"><img src="img/icon-${k}.png" alt="${p.name}"></span><span>${p.name}</span>`;
    li.addEventListener('click', () => togglePowerFilter(k));
    li.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); togglePowerFilter(k); }
    });
    root.appendChild(li);
  });
}

/* ---------- power-legend click-to-glow filter ---------- */
let activePower = null;
function togglePowerFilter(k){
  activePower = (activePower === k) ? null : k;
  applyPowerFilter();
}
function applyPowerFilter(){
  document.querySelectorAll('.legend-item').forEach(li => {
    const on = li.dataset.power === activePower;
    li.classList.toggle('is-selected', on);
    li.setAttribute('aria-pressed', String(on));
  });
  document.querySelectorAll('.card-slot').forEach(slot => {
    if(!activePower){
      slot.classList.remove('power-glow', 'power-dim');
      return;
    }
    const match = slot.dataset.power === activePower;
    slot.classList.toggle('power-glow', match);
    slot.classList.toggle('power-dim', !match);
  });
}

function makeCardSlot(item, kind){
  const meta = POWER_META[item.power];
  const slot = document.createElement('div');
  slot.className = 'card-slot';
  slot.dataset.power = item.power;
  slot.style.setProperty('--c', meta.color);
  slot.innerHTML = `
    <div class="shadow"></div>
    <div class="slot-frame"></div>
    <button class="card-face" type="button">
      <img src="${item.img}" alt="${item.name}" loading="lazy">
    </button>
    <span class="name">${item.variant ? `${item.name} · ${item.variant}` : item.name}</span>
  `;
  const btn = slot.querySelector('.card-face');
  const activate = () => showTooltip(slot, item, meta, kind);
  btn.addEventListener('mouseenter', activate);
  btn.addEventListener('focus', activate);
  btn.addEventListener('click', () => openCardModal(slot, item, meta, kind));
  slot.addEventListener('mouseleave', hideTooltipSoon);
  return slot;
}

// Fixed 3-column page grid, in list order — used identically for both sections
function buildFlatCase(mountId, items, kind){
  const mount = document.getElementById(mountId);
  const grid = document.createElement('div');
  grid.className = 'page-grid';
  items.forEach(item => grid.appendChild(makeCardSlot(item, kind)));
  mount.appendChild(grid);
}

/* ---------- tooltip logic (single fixed element, JS-positioned) ---------- */
const tooltip = document.getElementById('tooltip');
const ttKicker = tooltip.querySelector('.kicker');
const ttTitle  = tooltip.querySelector('h4');
const ttText   = tooltip.querySelector('p');
const ttSub    = tooltip.querySelector('.sub');
let hideTimer = null;
let activeSlot = null;

function showTooltip(slot, item, meta, kind){
  clearTimeout(hideTimer);
  if(activeSlot) activeSlot.classList.remove('is-active');
  activeSlot = slot;
  slot.classList.add('is-active');

  tooltip.style.setProperty('--c', meta.color);
  ttTitle.textContent = item.variant ? `${item.name} · Art ${item.variant}` : item.name;

  if(kind === 'guardian'){
    ttKicker.textContent = `${meta.name} Guardian`;
    ttText.textContent = meta.desc;
    ttText.classList.remove('placeholder');
    ttSub.hidden = false;
    ttSub.innerHTML = `<b>History</b>${item.history}`;
  } else {
    ttKicker.textContent = `${meta.name} · Game Card`;
    ttText.textContent = item.focus;
    ttText.classList.toggle('placeholder', item.power === 'unassigned');
    if(meta.call){ ttSub.hidden = false; ttSub.innerHTML = meta.call; }
    else { ttSub.hidden = true; }
  }

  tooltip.classList.add('show');
  positionTooltip(slot);
}

function positionTooltip(slot){
  const r = slot.getBoundingClientRect();
  const tw = tooltip.offsetWidth || 236;
  const th = tooltip.offsetHeight || 160;
  const margin = 12;

  let left = r.left + r.width/2 - tw/2;
  left = Math.max(margin, Math.min(left, window.innerWidth - tw - margin));

  let top = r.top - th - 14;
  if(top < margin){ top = r.bottom + 14; }
  top = Math.min(top, window.innerHeight - th - margin);

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function hideTooltipSoon(){
  hideTimer = setTimeout(() => {
    tooltip.classList.remove('show');
    if(activeSlot){ activeSlot.classList.remove('is-active'); activeSlot = null; }
  }, 60);
}

window.addEventListener('scroll', () => { tooltip.classList.remove('show'); if(activeSlot){activeSlot.classList.remove('is-active'); activeSlot=null;} }, {passive:true});

// touch: tap toggles, tap elsewhere dismisses
const isTouch = matchMedia('(hover: none)').matches;
if(isTouch){
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.card-slot')){
      tooltip.classList.remove('show');
      if(activeSlot){ activeSlot.classList.remove('is-active'); activeSlot = null; }
    }
  });
}

/* ---------- click-to-enlarge card viewer (FLIP animation) ---------- */
const modalBackdrop = document.getElementById('modal-backdrop');
const modalCard     = document.getElementById('modal-card');
const modalCardImg  = modalCard.querySelector('.card-face-front img');
const modalInfo     = document.getElementById('modal-info');
const miKicker = modalInfo.querySelector('.kicker');
const miTitle  = modalInfo.querySelector('h3');
const miText   = modalInfo.querySelector('p');
const miSub    = modalInfo.querySelector('.sub');
const modalClose = document.getElementById('modal-close');
const CARD_RATIO = 620/825;
let modalSlot = null;
let modalCloseTimer = null;

function layoutModalTargets(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const gap = 22;
  const wide = vw >= 700;

  if(wide){
    let cardH = Math.min(vh*0.74, 560);
    let cardW = cardH * CARD_RATIO;
    let infoW = Math.min(320, vw - cardW - gap*3);
    if(infoW >= 200){
      modalInfo.style.width = infoW+'px';
      const infoH = modalInfo.offsetHeight;
      const totalW = cardW + gap + infoW;
      const cardLeft = (vw - totalW)/2;
      const cardTop = (vh - cardH)/2;
      const infoLeft = cardLeft + cardW + gap;
      let infoTop = cardTop + (cardH - infoH)/2;
      infoTop = Math.max(16, Math.min(infoTop, vh - infoH - 16));
      modalInfo.style.maxHeight = ''; modalInfo.style.overflowY = '';
      return {
        card:{ left:cardLeft, top:cardTop, width:cardW, height:cardH },
        info:{ left:infoLeft, top:infoTop, width:infoW }
      };
    }
  }

  // narrow / stacked layout
  const margin = 18;
  let cardH = Math.min(vh*0.46, 380);
  let cardW = Math.min(cardH*CARD_RATIO, vw - margin*2);
  cardH = cardW / CARD_RATIO;
  const infoW = Math.min(vw - margin*2, 380);
  modalInfo.style.width = infoW+'px';
  const infoH = modalInfo.offsetHeight;
  const totalH = cardH + 16 + infoH;
  const top = Math.max(margin, (vh - totalH)/2);
  const cardTop = top;
  const cardLeft = (vw - cardW)/2;
  const infoLeft = (vw - infoW)/2;
  let infoTop = cardTop + cardH + 16;
  if(infoTop + infoH > vh - margin){
    modalInfo.style.maxHeight = (vh - infoTop - margin)+'px';
    modalInfo.style.overflowY = 'auto';
  } else {
    modalInfo.style.maxHeight = ''; modalInfo.style.overflowY = '';
  }
  return {
    card:{ left:cardLeft, top:cardTop, width:cardW, height:cardH },
    info:{ left:infoLeft, top:infoTop, width:infoW }
  };
}

function openCardModal(slot, item, meta, kind){
  clearTimeout(hideTimer);
  clearTimeout(modalCloseTimer);
  tooltip.classList.remove('show');
  if(activeSlot){ activeSlot.classList.remove('is-active'); activeSlot = null; }

  modalSlot = slot;
  slot.classList.add('is-active');

  const face = slot.querySelector('.card-face');
  const startRect = face.getBoundingClientRect();

  modalCard.style.setProperty('--c', meta.color);
  modalInfo.style.setProperty('--c', meta.color);
  modalCard.classList.remove('flipped', 'hint-show');
  modalCardImg.src = item.img;
  modalCardImg.alt = item.name;

  miTitle.textContent = item.variant ? `${item.name} · Art ${item.variant}` : item.name;
  if(kind === 'guardian'){
    miKicker.textContent = `${meta.name} Guardian`;
    miText.textContent = meta.desc;
    miText.classList.remove('placeholder');
    miSub.hidden = false;
    miSub.innerHTML = `<b>History</b>${item.history}`;
  } else {
    miKicker.textContent = `${meta.name} · Game Card`;
    miText.textContent = item.focus;
    miText.classList.toggle('placeholder', item.power === 'unassigned');
    if(meta.call){ miSub.hidden = false; miSub.innerHTML = meta.call; }
    else { miSub.hidden = true; }
  }

  // snap the enlarged card to the clicked card's exact on-screen slot, no transition
  modalCard.style.transition = 'none';
  modalCard.style.left = startRect.left+'px';
  modalCard.style.top = startRect.top+'px';
  modalCard.style.width = startRect.width+'px';
  modalCard.style.height = startRect.height+'px';
  modalCard.style.visibility = 'visible';
  modalCard.offsetHeight; // force reflow so the snap above isn't itself animated

  modalBackdrop.classList.add('show');
  document.body.style.overflow = 'hidden';

  const targets = layoutModalTargets();

  requestAnimationFrame(() => {
    modalCard.style.transition = '';
    requestAnimationFrame(() => {
      modalCard.style.left = targets.card.left+'px';
      modalCard.style.top = targets.card.top+'px';
      modalCard.style.width = targets.card.width+'px';
      modalCard.style.height = targets.card.height+'px';
      modalInfo.style.left = targets.info.left+'px';
      modalInfo.style.top = targets.info.top+'px';
    });
  });

  modalCloseTimer = setTimeout(() => {
    modalInfo.classList.add('show');
    modalClose.classList.add('show');
    modalCard.classList.add('hint-show');
  }, 170);
}

function flipModalCard(){
  if(!modalSlot) return;
  modalCard.classList.toggle('flipped');
  modalCard.classList.remove('hint-show');
}

function closeCardModal(){
  if(!modalSlot) return;
  clearTimeout(modalCloseTimer);
  const slot = modalSlot;
  const face = slot.querySelector('.card-face');
  const endRect = face.getBoundingClientRect();

  modalInfo.classList.remove('show');
  modalClose.classList.remove('show');
  modalBackdrop.classList.remove('show');

  modalCard.style.left = endRect.left+'px';
  modalCard.style.top = endRect.top+'px';
  modalCard.style.width = endRect.width+'px';
  modalCard.style.height = endRect.height+'px';

  document.body.style.overflow = '';
  slot.classList.remove('is-active');
  modalSlot = null;
  modalCard.classList.remove('hint-show');

  modalCloseTimer = setTimeout(() => { modalCard.style.visibility = 'hidden'; modalCard.classList.remove('flipped'); }, 400);
}

modalBackdrop.addEventListener('click', closeCardModal);
modalCard.addEventListener('click', flipModalCard);
modalClose.addEventListener('click', (e) => { e.stopPropagation(); closeCardModal(); });
modalInfo.addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && modalSlot) closeCardModal(); });
window.addEventListener('resize', () => {
  if(!modalSlot) return;
  const targets = layoutModalTargets();
  modalCard.style.left = targets.card.left+'px';
  modalCard.style.top = targets.card.top+'px';
  modalCard.style.width = targets.card.width+'px';
  modalCard.style.height = targets.card.height+'px';
  modalInfo.style.left = targets.info.left+'px';
  modalInfo.style.top = targets.info.top+'px';
});

/* ---------- ambient gold flecks ---------- */
const motesRoot = document.getElementById('motes');
for(let i=0;i<85;i++){
  const m = document.createElement('div');
  const isBig = Math.random() < 0.22;
  m.className = 'mote' + (Math.random() < 0.18 ? ' blue' : '') + (isBig ? ' big' : '');
  const size = isBig ? 5 + Math.random()*4 : 2 + Math.random()*3;
  m.style.width = size+'px';
  m.style.height = size+'px';
  m.style.left = Math.random()*100+'vw';
  m.style.bottom = '-10px';
  m.style.animationDuration = (18 + Math.random()*22)+'s';
  m.style.animationDelay = (Math.random()*18)+'s';
  motesRoot.appendChild(m);
}

buildLegend();
buildFlatCase('guardian-case', GUARDIANS, 'guardian');
buildFlatCase('game-case', GAMES, 'game');

/* ---------- book-opening intro ---------- */
(function(){
  const intro = document.getElementById('intro');
  const replayBtn = document.getElementById('replay-intro');
  if(!intro) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let opened = false;

  /* sparks that gather toward the seal while the vault charges, then scatter outward on opening */
  const sparksRoot = document.getElementById('introSparks');
  if(sparksRoot && !reduceMotion){
    const SPARK_COUNT = 14;
    for(let i=0;i<SPARK_COUNT;i++){
      const ang = (Math.PI*2/SPARK_COUNT)*i + (Math.random()*0.4-0.2);
      const radius = 90 + Math.random()*80;
      const x = Math.cos(ang)*radius, y = Math.sin(ang)*radius;
      const s = document.createElement('div');
      s.className = 'intro-spark';
      s.style.setProperty('--sx', x.toFixed(1)+'px');
      s.style.setProperty('--sy', y.toFixed(1)+'px');
      sparksRoot.appendChild(s);
    }
  }

  /* fire one beam of colored light from each sigil to the seal, timed to its ignite delay */
  const beamsRoot = document.getElementById('introBeams');
  const BEAM_COLORS = ['rgba(239,68,68,.95)','rgba(34,197,94,.95)','rgba(59,130,246,.95)','rgba(234,179,8,.95)','rgba(168,85,247,.95)'];
  const SIGIL_DELAYS_MS = [0, 500, 1000, 1500, 2000]; // matches each .sigil.s-* animation-delay in CSS
  const BEAM_LEAD_MS = 250;   // let each sigil visibly glow on its own before it sends its beam
  const BEAM_TRAVEL_MS = 550; // matches the .55s beamFly animation
  const LAST_BEAM_ARRIVAL_MS = SIGIL_DELAYS_MS[SIGIL_DELAYS_MS.length-1] + BEAM_LEAD_MS + BEAM_TRAVEL_MS;

  function launchBeams(){
    if(!beamsRoot) return;
    beamsRoot.innerHTML = '';
    const sigilEls = intro.querySelectorAll('.sigil');
    const sealEl = intro.querySelector('.intro-seal');
    if(!sealEl || !sigilEls.length) return;
    const introRect = intro.getBoundingClientRect();
    const sealRect = sealEl.getBoundingClientRect();
    const ex = sealRect.left + sealRect.width/2 - introRect.left;
    const ey = sealRect.top + sealRect.height/2 - introRect.top;
    sigilEls.forEach((sigilEl, i) => {
      const r = sigilEl.getBoundingClientRect();
      const sx = r.left + r.width/2 - introRect.left;
      const sy = r.top + r.height/2 - introRect.top;
      const dx = ex - sx, dy = ey - sy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const angle = Math.atan2(dy, dx) * 180/Math.PI;
      const beam = document.createElement('div');
      beam.className = 'intro-beam';
      beam.style.left = sx+'px';
      beam.style.top = sy+'px';
      beam.style.width = dist+'px';
      beam.style.setProperty('--rot', angle+'deg');
      beam.style.setProperty('--bc', BEAM_COLORS[i % BEAM_COLORS.length]);
      beam.style.animationDelay = (SIGIL_DELAYS_MS[i % SIGIL_DELAYS_MS.length] + BEAM_LEAD_MS) + 'ms';
      beamsRoot.appendChild(beam);
    });
  }

  function openBook(){
    if(opened) return;
    opened = true;
    if(reduceMotion){ intro.style.display = 'none'; return; }

    const CHARGE_AT = LAST_BEAM_ARRIVAL_MS + 400; // a real beat of suspense after the last power lands
    const OPEN_AT = CHARGE_AT + 850;               // hold the bloom before the vault answers
    const HIDE_AT = OPEN_AT + 1750;

    intro.style.setProperty('--anticipate-dur', CHARGE_AT + 'ms');
    intro.classList.add('anticipate');
    launchBeams();

    setTimeout(() => {
      intro.classList.remove('anticipate');
      intro.classList.add('charged');
    }, CHARGE_AT);

    setTimeout(() => {
      intro.classList.remove('charged');
      intro.classList.add('opening');
    }, OPEN_AT);

    setTimeout(() => { intro.style.display = 'none'; }, HIDE_AT);
  }

  function resetIntro(){
    intro.classList.add('no-anim');
    intro.classList.remove('opening', 'anticipate', 'charged');
    intro.style.display = 'flex';
    if(beamsRoot) beamsRoot.innerHTML = '';
    void intro.offsetWidth; /* force reflow before re-enabling transitions */
    intro.classList.remove('no-anim');
    opened = false;
  }

  intro.addEventListener('click', openBook);
  intro.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBook(); }
  });
  // Wait for the user to actually tap/click/press before opening -- no auto-play.
  // Reduced-motion visitors skip the theatrics entirely and land straight on the content.
  if(reduceMotion){ openBook(); }

  if(replayBtn){
    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetIntro();
      // Just reset the doors closed and wait for a tap again -- no auto-open.
    });
  }
})();
</script>
